<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 70px 20px;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
            text-align: center;
        }
        h1 { margin-bottom: 30px; }
        input {
            width: 90%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }
        button {
            margin-top: 20px;
            padding: 13px 28px;
            border: 0;
            border-radius: 7px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 28px;
            line-height: 1.8;
            font-size: 17px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Emotion Detection Application</h1>
        <input id="textToAnalyze" type="text"
               placeholder="Enter a sentence...">
        <br>
        <button onclick="analyzeEmotion()">Analyze Emotion</button>
        <div id="result"></div>
    </div>

    <script>
        function analyzeEmotion() {
            const text = document.getElementById("textToAnalyze").value;

            fetch("/emotionDetector?textToAnalyze=" +
                  encodeURIComponent(text))
                .then(response => response.text())
                .then(data => {
                    document.getElementById("result").innerHTML = data;
                })
                .catch(() => {
                    document.getElementById("result").innerHTML =
                        "Error occurred while processing the request.";
                });
        }
    </script>
</body>
</html>
